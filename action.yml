name: "ops-agent"
description: "Run ops-agent on a labeled task fixture (deterministic local loop)."
branding:
  icon: "terminal"
  color: "blue"

# LATER STUB: GitHub Action marketplace packaging (release tags, README badges,
# documented inputs for live LLM keys). Do not publish this as a finished Action.

inputs:
  fixture:
    description: "Fixture id under evals/fixtures/ (e.g. fix_off_by_one)."
    required: false
    default: "fix_off_by_one"
  skip-agent:
    description: "Skip the agent loop and only print a plan + pending row."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ops-agent from this checkout
      shell: bash
      run: pip install "$GITHUB_ACTION_PATH"
    - name: Run CLI on fixture
      shell: bash
      env:
        FIXTURE: ${{ inputs.fixture }}
        SKIP_AGENT: ${{ inputs.skip-agent }}
      run: |
        set -euo pipefail
        extra=()
        if [ "$SKIP_AGENT" != "true" ]; then
          extra+=(--agent)
        fi
        ops-agent run "$FIXTURE" "${extra[@]}"
        ops-agent eval
