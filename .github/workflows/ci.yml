name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Types (mypy)
        run: mypy
      - name: Tests (pytest)
        run: pytest -q
      - name: CLI fixture smoke (real local loop)
        run: |
          # Milestone 2: run the deterministic loop on one fixture, then
          # score every local fixture. No API key. Numbers come from this job.
          ops-agent run fix_off_by_one --agent
          ops-agent eval
