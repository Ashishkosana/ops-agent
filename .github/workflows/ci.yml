name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Types (mypy)
        run: mypy
      - name: Tests (pytest)
        run: pytest -q
      - name: CLI fixture smoke (agent not implemented — expected)
        run: |
          # Scaffold contract: `ops-agent run` loads a fixture, calls the stub
          # planner, prints a pending scorecard (em-dashes), and exits 0.
          # Do not use --strict here; that gate is for after YOU IMPLEMENT.
          ops-agent run fix_off_by_one
          ops-agent eval
